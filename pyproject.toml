[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lstm-ts-trainer"
version = "0.1.0"
description = "Timeseries LSTM trainer"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "requests>=2.31.0",
  "pydantic==2.12.5",
  "PyYAML==6.0.3",
  "setuptools==80.10.2",
  "pytest==9.0.2",
  "pandas==2.1.4",
  "scikit-learn==1.8.0",
  "tensorflow[and-cuda]==2.20.0",
  "numpy==1.26.4",
  "matplotlib==3.10.1",
  "joblib==1.4.2",
]

[tool.setuptools.packages.find]
where = ["program"]